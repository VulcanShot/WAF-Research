  - source: client_traffic
    # Legitimate traffic, some specific to the vulnapp, some others generic traffic to target any use of protobufjs in a web server
    requests:
      - label: "Valid User schema (legal identifier type names) via the JSON endpoint."
        method: POST
        route: /api/user/decode
        query_string: ""
        headers: { Host: app.example.com, Content-Type: application/json }
        body: '{"schema":{"nested":{"User":{"fields":{"id":{"type":"int32","id":1},"name":{"type":"string","id":2}}}}},"data":""}'
        is_exploit: false

      - label: "Valid User schema uploaded as a file (benign schema, attachment transport)."
        method: POST
        route: /api/user/decode/upload
        query_string: ""
        headers: { Host: app.example.com, Content-Type: "multipart/form-data; boundary=----pbupload" }
        body: "------pbupload\r\nContent-Disposition: form-data; name=\"schema\"; filename=\"user.json\"\r\nContent-Type: application/json\r\n\r\n{\"nested\":{\"User\":{\"fields\":{\"id\":{\"type\":\"int32\",\"id\":1},\"name\":{\"type\":\"string\",\"id\":2}}}}}\r\n------pbupload\r\nContent-Disposition: form-data; name=\"data\"\r\n\r\n\r\n------pbupload--\r\n"
        is_exploit: false

      - label: "data-pipeline API — a JS snippet in a value plus a 'fields' key; must not block."
        method: POST
        route: /data-pipeline
        query_string: ""
        headers: { Host: app.example.com, Content-Type: application/json }
        body: '{"fields":["id","email"],"transform":"map(row){ return row.id }","enabled":true}'
        is_exploit: false

      - label: "GraphQL API — query value carries ') {' and a 'fields' key, all in values; must not block."
        method: POST
        route: /graphql
        query_string: ""
        headers: { Host: app.example.com, Content-Type: application/json }
        body: '{"query":"query($id:ID!){ user(id:$id){ name email } }","variables":{"id":"42","fields":["name","email"]}}'
